schema: spec-driven

context: |
  语言：中文
  写作要求：
  - OpenSpec 变更文档和长期基线文档默认使用中文。
  - 中文表达必须符合中文技术文档的常用说法，避免逐词直译英文句式。
  - 新建 Requirement 和 Scenario 的标题默认使用中文；MODIFIED Requirement 的 canonical
    标题是跨 artifact 的稳定引用，必须保留与基线精确一致的标题，不得借正文中文化静默
    翻译、重命名或拆分。若确需重命名，使用显式 RENAMED 并同步引用，不得以 MODIFIED
    隐式改名。
  - spec 中 BCP 14 规范关键词继续使用全大写英文；代码标识符、类型、字段、枚举值、API、
    package、artifact、命令和路径保持英文或使用反引号，不为追求全中文而翻译契约名称。
  - 代码示例和文件路径保持英文。

  TileScript 是面向 AI 辅助优化的跨硬件 Tile 级编程语言：把优化决策权从编译器启发式
  转移到人与 AI agent 手中，编译器忠实执行显式意图并输出结构化诊断。核心价值主张：
  显式优化控制（MMA 形状、warp 特化、pipeline 手柄）、源码级结构化诊断（JSON Schema）、
  确定性编译（同一源码 + 同一目标产物 hash 一致）。当前支持 NVIDIA 后端，Ascend 为
  实验级目标。权威产品、架构和行为契约位于 openspec/；veps/ 只存放非正式交付文档，
  不是规范来源。

  OpenSpec 用于管理当前行为契约基线和增量变更。当前稳定行为保存在 openspec/specs/，
  当前稳定设计保存在 openspec/designs/。active change 的设计先写在
  openspec/changes/<change>/design.md，归档后再提炼到稳定设计文档，不机械复制历史过程。

  OpenSpec 编写原则：
  - 需求必须符合第一性原理：先定义真实问题、系统不变量和职责边界；引用 Triton、
    TileLang、CuTe 等既有形态作为依据时，回到"它解决了什么问题"验证该问题在本仓存在。
  - 文档是开发和审查工具，不为文档而文档；每个文档必须回答一个稳定使用问题。
  - 设计和实现优先 KISS、SOLID；选择最小、清晰、职责单一的方案。
  - TileScript 的需求和设计必须按编程语言/编译器场景审视质量属性：正确性、性能、
    可移植性（NVIDIA/Ascend 双目标）、可诊断性、可测试性、兼容性。质量属性若形成
    系统黑盒可验证契约，必须作为 Requirement 写入 spec；只影响单个实现内部的机制
    写入该处 design。不得要求每个能力机械覆盖全部质量属性。
  - 当存在多个可行方案时，design 必须依据已声明的约束和决策标准选择唯一实现方案，
    并说明选择理由；未选择方案按取舍记录。
  - 不得把影响行为、契约、错误码、诊断 schema、确定性、持久化或验收的选择延迟到
    实现阶段。若选择尚无法收敛，必须先澄清需求或补充设计，不得生成依赖该选择的
    可实施任务。
  - 遵守 CLAUDE.md 的权威关系与工程约束；不得在 OpenSpec 中复制长篇工程指南。
  - 本文件的 context 和 artifact rules 是项目级 OpenSpec 编写约束：context 适用于全部
    artifacts，artifact rule 只细化对应 artifact 且不得削弱 context。

  语言设计不变量（裁决 API 争议的权威依据）：
  - 显式优先：任何影响性能的决策用户必须能显式指定；未指定时使用固定、可预测、有文档
    的默认值，编译器不做搜索、不自动降级。
  - 一个概念一个原语：不允许同义原语并存（如 dot 的多种变体）。
  - 每个原语都有诊断挂点：原语的 lowering 结果必须能在诊断 JSON 中以源码行号定位。
  - 类型系统承担安全，不承担性能：scope 体系只保证不越界、不跨作用域误用。

  语言规范专有规则：
  - TileScript 是类 Python（Python AST 子集）的设备代码语言。语法的接受集与拒绝行为
    是行为契约：接受哪些 Python 语法、拒绝哪些（含错误码）必须在 spec 定义，不得让
    实现的解析器行为隐式决定语言边界。
  - 宿主 Python 与设备代码的边界（哪些表达式编译期求值、哪些运行期执行、comptime 的
    边界）是行为契约，属于 specs。
  - 错误码（E0xxx）是稳定公共契约。定义错误码的 Requirement 必须覆盖：精确触发条件、
    错误消息要素和恢复建议。新增错误码不破坏兼容；修改、删除或复用既有错误码编号是
    破坏性变更，必须在 proposal 标记 BREAKING。
  - 诊断 JSON Schema 是版本化公共契约：向后兼容承诺（字段只增不改不删、枚举只增、
    语义变化用新字段）必须由 spec 定义；每个诊断字段必须声明精度等级（精确 / 静态估算
    estimated / unknown），估算不得伪装精确。
  - 确定性编译是横切契约：任何影响解析、类型检查、lowering 或代码生成的 change，其
    design 必须声明对 deterministic_hash 的影响；禁止引入依赖时间、环境、随机源或
    未排序遍历的编译行为。
  - 数值语义必须闭合：浮点求值顺序、归约结合性、类型转换舍入规则和跨硬件数值一致性
    容差必须在 spec 定义；改变数值行为的 change 必须包含数值一致性验证任务。
  - 默认值与 Auto 行为必须满足三要件：选择算法确定性、写入文档、出现在诊断 JSON 中。
    HAL 能力描述（含 mma_shapes 等列表的顺序语义）是公共契约，属于 specs。
  - 性能数字属于里程碑验收（veps/designs 层面），不写入行为 spec；确需性能
    Requirement 时必须定义基准、目标硬件、测量方法、测量边界和容差。
  - capabilities 组织约定：language/*（语法与类型系统）、primitives/*（原语族）、
    diagnostics/*（诊断 schema 与精度）、hal/*（硬件能力描述）、portability/*（跨
    硬件行为）；新增 capability 遵循该结构，不新建同义顶层目录。
  - tis.* 公共 API（原语签名、装饰器、类型注解）的破坏性变更与语言语义变更同样必须在
    proposal 标记 BREAKING，并说明迁移路径或明确不提供。

  受约束自然语言：

  总目标：
  - 对同一输入、状态和上下文，独立实现者必须从文档得出相同的责任主体、行为、结果和
    失败语义。文档显式允许的可选行为除外，但允许范围、默认行为和互操作边界必须完整定义。
  - 每条规范必须客观、确定、可观察、可验证。若两个合理解释会产生不同系统事实或合规
    结论，必须重写。

  术语：
  - 一个概念使用一个 canonical name，一个规范动作使用一个 canonical verb，一个字段
    使用一个定义。proposal、specs、design、tasks 和测试必须复用相同名称，不得轮换同义词。
  - 新增或改变语义的术语必须在首次规范性使用前定义；既有术语允许引用权威 spec、design
    或契约。alias 只有在兼容性契约明确映射方向和移除条件时才允许存在。
  - 不强制引入术语 ID；Requirement 名称和明确章节标题足以唯一引用时，直接使用这些名称。

  规范关键词：
  - 规范关键词采用 RFC 2119 / RFC 8174（BCP 14）语义；只有全大写形式具有规范含义。
    新文本使用 MUST、MUST NOT、SHOULD、SHOULD NOT、MAY、OPTIONAL。
  - BCP 14 规范关键词只适用于 spec Requirement 中的系统行为；config、schema 和模板中
    的编写约束使用中文"必须""不得""允许"，这些词表达工作流约束，不具有 BCP 14 语义。
  - 新增强制义务使用 MUST / MUST NOT；只有允许偏离的义务才能使用 SHOULD / SHOULD NOT，
    且必须说明允许偏离的客观条件、偏离后的行为和验证方式；只有允许选择的行为才能使用
    MAY / OPTIONAL，且必须说明选择条件、字段缺失时的行为和默认结果。MAY / OPTIONAL
    不得表示未解决的设计选择或 deferred。

  语义闭合：
  - requirement 和 scenarios 共同明确责任主体、适用条件、前置状态、输入、行为、输出、
    副作用、失败结果和可观察证据。某项要素与行为无关时不要求机械填写，但不得省略会
    改变合规结论的要素。
  - 每个规范性句子只表达一个可独立判断的义务；事实、规范、rationale 和 example 分开表达。
  - 条件规则必须说明条件不成立、多个条件同时成立和无规则匹配时的行为。
  - 使用"全部""任一""至少一个""恰好一个"等明确量词；需要穷尽判断的列表不得使用"等"
    "包括但不限于"；"A 或 B"必须明确是否允许同时成立。
  - 可量化或时序行为必须定义数值、单位、适用条件、测量起止和边界；允许测量误差时必须
    定义容差。
  - 不得使用"必要时""正常情况下""合理处理""适当""尽快"或"等价实现"等开放式表达替代契约。

  条件式精确表达：
  - 受约束自然语言是默认表达方式。表格、状态转换图、truth/decision table、typed
    pseudocode、BNF/ABNF、mapping table 和 schema 只在自然语言无法唯一表达条件组合、
    优先级、排序或映射时使用，不是每个 change 的固定章节。
  - 当系统行为实际由有限状态及转换决定时，必须使用最小状态转换表或等价表达，列出
    initial/terminal state、trigger、guard 和非法转换；不得为无状态行为发明状态机。
  - specs 新增或修改公共 contract schema（含诊断 JSON Schema）时，只定义受影响对象和
    字段的 type、required/optional、nullability、default、allowed values/range、
    unit/encoding、字段间约束和契约边界可观察的校验结果。design 新增或修改私有数据
    结构时同理，并定义 trusted source、owner 和跨层映射。未变化的数据不得为填充模板
    重复定义；同一字段不得跨 artifact 重复定义。

  验证与兼容：
  - Change 整体的 scenarios 和验证必须覆盖实际存在的 normal、boundary 和 failure/
    degradation path；不要求每个 requirement 机械创建三类 scenario，也不要求为不存在
    的类别填写 N/A。
  - Requirement 与相关 scenarios 共同构成可观察行为验收用例及其测试预期（oracle）的
    规范来源。验收用例的前置条件、触发输入和测试预期必须从所引用的 Requirement/
    Scenario 独立推导。实现代码、私有分支和当前运行输出只能作为现状证据，不得定义或
    修改目标测试预期。
  - 行为验证必须断言契约、边界条件或系统黑盒可观察结果（编译输出、诊断 JSON、错误码、
    公共 API 返回），不得断言私有实现细节。只有引用唯一 design 约束的架构验证才允许
    检查源码边界。
  - 新增或修改可观察行为时，必须先编写表达目标行为的测试；变更前系统不满足目标行为时，
    实施前必须运行测试并确认失败。缺陷修复必须先复现失败；行为保持型重构必须先建立
    通过的基线，修改后必须继续通过。
  - 关键词扫描和表格数量不能替代语义审查。

rules:
  proposal:
    - |
      proposal 必须从 actor 或系统黑盒使用者视角说明问题、目标结果、范围和影响。actor
      可以是 TileScript 语言用户、AI agent、编译器集成方、后端开发者或工具链使用者；
      不得用 package、模块、文件路径或实现步骤代替需求和目标。
    - |
      必须包含 capabilities 声明，明确每个 capability 是新增还是修改：新 capability
      必须严格对应一个 specs/<kebab-case>/spec.md；修改的 capability 必须使用
      openspec/specs/ 下的既有路径。无 spec 级行为变化（纯重构、工具、文档）时使用
      skip_specs: true，不得为满足校验发明 requirement。
    - |
      背景、目标、非目标、主动变更范围和被动影响必须分开表达，不得用实现任务替代系统
      可验证目标。非目标定义明确排除、deferred 和重要不变边界；影响只说明被动波及的
      代码、API、依赖、配置或测试面，不得建立新需求或重复 scope。
    - |
      change 新增术语，或既有术语的语义变化会影响行为边界时，必须在 proposal 中定义；
      否则不得创建空章节。
    - |
      proposal 不得包含"归档前更新基线"或长期文档文件清单；这些由 design 的"长期基线
      刷新计划"唯一承载。
    - |
      破坏性变更义务：改变语言语义（语法接受集、类型规则、原词语义、数值行为、错误码、
      诊断 JSON Schema、确定性承诺）或 tis.* 公共 API 兼容性的 change，必须在 proposal
      的 What Changes 中逐项标记 BREAKING，并说明影响面与迁移路径（或明确不提供）；
      未标记的破坏性变更在设计审查中必须被指出。
  specs:
    - |
      spec 的 Requirement 正文、Scenario 标题和 WHEN/THEN/AND 语句默认使用中文；BCP 14
      关键词以及代码标识符、类型、字段、枚举值、API、package、命令和路径保留英文。
    - |
      MODIFIED requirement 名称必须精确匹配现有基线 requirement 名称，并完整重述目标
      状态，不得只写差异。
    - |
      delta spec 必须对照同名目标 stable spec 校验 Requirement operation：目标 stable
      spec 已存在时，ADDED 名称不得已存在，MODIFIED 和 REMOVED 名称必须恰好存在一次；
      目标 stable spec 不存在时只允许 ADDED。匹配按标题精确且区分大小写。
    - |
      每个 ADDED Requirement 和完整重述的 MODIFIED Requirement 必须定义可验证的系统
      行为，不得用"增强""优化""稳定运行"或"合理处理"替代可验证行为契约。
    - |
      每个 ADDED Requirement 和完整重述的 MODIFIED Requirement 必须至少包含一个
      Scenario；相关 Scenarios 必须覆盖该行为实际存在的正常、边界和失败/降级验收路径。
      REMOVED 和 RENAMED 不要求 Scenario。
    - |
      语言行为的 spec 归类：语法接受集与拒绝错误码、类型规则与作用域转移矩阵、原语
      语义（含失败路径与错误码）、数值语义与跨硬件容差、诊断 JSON Schema 字段与精度
      等级、HAL 能力描述字段语义、确定性承诺和 portability 行为都属于 specs；具体
      后端 lowering 路径、pass 实现、IR 内部表示、Z3 验证机制和模块组织属于 design。
  design:
    - |
      design 的第一个正文 section 必须是"设计范围"：紧凑导航，说明每个受影响 capability
      的目标变化、对应 delta specs 和设计章节；不得在首个标题前堆放无章节归属的元数据。
    - |
      每个受影响 capability 按"目标与规范依据 → 当前实现 → GAP 分析 → 修改方案"的顺序
      组织。"当前实现"只记录相关现状；"GAP 分析"把规范目标、当前事实和待闭合差距对应
      起来，不得把目标态决策混入当前事实；"修改方案"必须给出闭合 GAP 的最小 delta、
      必须保留的现有路径、明确不修改的边界、owner 与模块协作、内部状态与数据、失败路径
      和验证关注点。
    - |
      只有存在会影响实现或验收的实质备选方案时，才单独记录适用条件、主要取舍和未选择
      理由；简单取舍在相关设计决策中说明，不得创建空的备选方案章节。只展开与 change
      实际相关的设计内容，不得为填写模板发明概念。
    - |
      design 必须包含"长期基线刷新计划"，按实际影响列出具体 stable spec、design 文档
      和 overview 目标；不受影响的类别明确写"无"。该计划是归档输入，不作为实施 task。
    - |
      影响解析、类型检查、lowering 或代码生成的 change，design 的"修改方案"必须包含
      "确定性影响"说明：deterministic_hash 是否变化、变化的授权理由（如语义修正），
      以及验证方式（重复编译 hash 一致性）。
    - |
      同一状态语义、API schema、数据 owner 或接口语义只能有一个主承载位置，其他位置
      只引用。
  tasks:
    - |
      tasks 按可独立验收的交付结果组织；能被"部分完成"的 task 必须拆分。共享的契约
      确认、整体验证和归档前检查单独分组。
    - |
      每个实现类 task 必须写明目标对象、精确 delta、来源和验证方式，不增加 specs/design
      未定义的行为。来源按任务语义填写：行为任务引用 Requirement + Scenario；白盒
      设计约束任务引用精确 design 章节。
    - |
      task 的验收结果和验证预期必须从其"来源"独立推导；所引用的 artifact 无法唯一确定
      目标预期时，必须先修订 artifact，不得交由实施阶段决定。
    - |
      验证只将 task 已定义的验收结果映射为可执行证据。每个 task 必须提供可重复的验证
      方式和预期结果；新增或修改可观察行为的 task 必须包含相关可执行测试命令，其他
      task 允许使用 build、lint、schema validation 或"无法自动化的原因 + 精确 code
      review 检查点"。
    - |
      新增或修改可观察行为时，必须先编写表达目标行为的测试；变更前系统不满足目标行为
      时实施前必须运行并确认失败。缺陷修复必须先复现失败。
    - |
      勾选 task 前必须执行其验证并记录实际命令和结果；验证未通过时不得勾选，不得只写
      "测试通过"。长期基线更新由归档前流程执行，不作为实施阶段默认 checkbox。
    - |
      改变数值行为（求值顺序、归约结合性、cast 舍入、跨硬件一致性）的 task，验证必须
      包含与参照实现的数值对比并声明容差；只断言"结果一致"而不定义容差不构成有效
      验证。影响编译产物的 task 验证必须包含重复编译 hash 一致性检查。

operations:
  apply:
    guidance:
      - |
        以 TDD 节奏逐 task 闭环：行为变更先写表达验收语义的失败测试，再实现到通过。
      - |
        只改 active change 和代码；发现 design/task 缺陷时先修订 artifact 再继续，不得
        偏离已批准的设计自行决策。
      - |
        实施中不得 commit；候选代码由主流程在验证和审查后统一 commit。
  archive:
    guidance:
      - |
        归档前先按该 change design 的"长期基线刷新计划"同步 specs/designs/overview，
        不机械复制历史过程。
      - |
        reviews/ 目录随 change 一起归档，保留完整审查账本。
